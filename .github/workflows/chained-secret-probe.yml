name: chained-secret-probe
on:
  workflow_run:
    workflows: ['pr']
    types: [completed]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Run fork-controlled script with dummy secret in env
        env:
          FAKE_TEST_KEY: ${{ secrets.FAKE_TEST_KEY }}
        run: bash scripts/ci-probe.sh
