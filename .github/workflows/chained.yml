name: chained
on:
  workflow_run:
    workflows: ["pr"]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run is a low-trust trigger: the default cache access is read-only.
    # This explicit opt-in is what makes the cache-to below actually write.
    cache-mode: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Cross-repo ("fork") PR heads need this opt-in (see cache-writer.yml).
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Report effective cache mode (set by the runner)
        run: |
          echo "RESULT cache_mode=${ACTIONS_CACHE_MODE}"
          echo "::notice title=RESULT chained::event=${GITHUB_EVENT_NAME} head_sha=${GITHUB_SHA} cache_mode=${ACTIONS_CACHE_MODE}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lab-img:chained
          cache-from: type=gha,scope=lab
          cache-to: type=gha,mode=max,scope=lab
      - run: docker run --rm lab-img:chained
