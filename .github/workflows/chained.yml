name: chained
on:
  workflow_run:
    workflows: ["pr"]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lab-img:chained
          cache-from: type=gha,scope=lab
          cache-to: type=gha,mode=max,scope=lab
      - run: docker run --rm lab-img:chained
