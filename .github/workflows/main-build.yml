name: main-build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lab-img:main
          cache-from: type=gha,scope=lab
      - run: echo "source on main: $(cat src/value.txt)" && docker run --rm lab-img:main
